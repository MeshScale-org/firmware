; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
name = uReticulum-Firmware
default_envs = heltec_wifi_lora_32_V3

extra_configs = 
    variants/*/*.ini
    variants/*/*/platformio.ini
    
[env]

build_unflags = -fno-exceptions ; excetions used in microreticulum library
build_flags =
    ; -I src



    

[arduino_base]
framework = arduino
build_src_filter = ${env.build_src_filter}
build_flags= ${env.build_flags}
lib_deps=


[reticulum_base]
build_flags=
    -D DEBUGLOG_DEFAULT_LOG_LEVEL_WARN
lib_deps=
    ;https://github.com/attermann/microReticulum.git#b8be484624b69819b9d69aeae0ca85bdeb19e626
    ;ArduinoJson@^7.4.2
	;MsgPack@^0.4.2
	;https://github.com/attermann/Crypto.git



[radiolib_base]
build_flags=
lib_deps=
    jgromes/RadioLib@^7.4.0

