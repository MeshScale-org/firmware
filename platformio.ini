; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
name = meshScale
default_envs = heltec_T114_v2, heltec_wifi_lora_32_V3, rak4630

extra_configs = 
    variants/*/*.ini
    variants/*/*/platformio.ini
    
[env]
build_flags = 
	-std=c++11
	;-Wall
	;-Wextra
	-Wno-missing-field-initializers
	-Wno-format
	-Wno-unused-parameter
	-Wno-unknown-pragmas
	;-Isrc
	;-DLIBRARY_TEST
	;-DNDEBUG
	;-DRNS_USE_FS
	;-DRNS_PERSIST_PATHS
lib_deps=
	nanopb/Nanopb@0.4.91

[arduino_base]
framework = arduino
extends= env
monitor_speed = 115200
build_src_filter = 
    ${env.build_src_filter}
build_flags= 
    ${env.build_flags}
lib_deps=
    ${env.lib_deps}



[reticulum_base]
build_flags=
    -fexceptions
build_unflags=
    -fno-exceptions ; exceptions used in microreticulum library
lib_deps=
    https://github.com/Woutvstk/microReticulum.git#20a70222413903f7206acba9e3eb40737704f502
    ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git



[radiolib_base]
lib_deps=
    jgromes/RadioLib@^7.4.0

