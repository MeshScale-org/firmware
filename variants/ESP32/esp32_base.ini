[esp32_base]
extends = arduino_base
platform = platformio/espressif32@^6.12.0
board_build.filesystem = littlefs
build_flags=
    ${env.build_flags}
    ${reticulum_base.build_flags}
    -D MCU_ESP32
    -D USE_RTOS
lib_deps=
    ${arduino_base.lib_deps}
    ${reticulum_base.lib_deps}
    ${radiolib_base.lib_deps}