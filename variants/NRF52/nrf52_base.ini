[nrf52_base]
extends = arduino_base
platform = platformio/nordicnrf52@^10.10.0
platform_packages = platformio/framework-arduinoadafruitnrf52@^1.10700.0
build_src_filter = 
  ${arduino_base.build_src_filter}

build_flags=
    ${arduino_base.build_flags}
    ${reticulum_base.build_flags}
    ${radiolib_base.build_flags}
lib_deps=
    ${arduino_base.lib_deps}
    ${reticulum_base.lib_deps}
    ${radiolib_base.lib_deps}

